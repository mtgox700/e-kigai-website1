<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Politique de Confidentialité | e-kigai</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Space+Grotesk:wght@300;500;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #ffffef;
            --dark: #3b3b3b;
            --green: #00bf63;
            --paper-grain: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }

        body {
            background-color: var(--cream);
            color: var(--dark);
            font-family: 'Space Grotesk', sans-serif;
            background-image: var(--paper-grain);
            overflow-x: hidden;
            cursor: text;
        }

        .typewriter {
            font-family: 'Courier Prime', monospace;
        }

        .hand-font {
            font-family: 'Gochi Hand', cursive;
        }

        /* Effet "Texte Censuré" (Révélation au survol) */
        .redacted {
            background-color: black;
            color: black;
            padding: 0 4px;
            transition: all 0.3s ease;
            cursor: help;
        }
        .redacted:hover {
            background-color: transparent;
            color: var(--green);
            text-decoration: underline;
        }

        /* Effet "Dossier Papier" */
        .folder-tab {
            clip-path: polygon(0 0, 85% 0, 90% 100%, 0% 100%);
        }

        /* Sticker */
        .sticker {
            background: white;
            border: 2px solid var(--dark);
            box-shadow: 4px 4px 0px var(--dark);
            transition: all 0.2s ease;
        }
        .sticker:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--green);
        }

        /* Stamp Effect */
        .stamp-top-secret {
            mask-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="1.5" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="table" tableValues="0 1 0"/><feFuncG type="table" tableValues="0 1 0"/><feFuncB type="table" tableValues="0 1 0"/></feComponentTransfer></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.8"/></svg>');
            mix-blend-mode: multiply;
            border: 4px solid #ef4444;
            color: #ef4444;
            font-weight: bold;
            text-transform: uppercase;
            padding: 0.5rem 1rem;
            transform: rotate(-12deg);
            display: inline-block;
            font-family: 'Courier Prime', monospace;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // SVG Icons internes
        const ScribbleIcon = ({ path, className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className} style={{overflow: 'visible'}}>
                {path}
            </svg>
        );

        const Icons = {
            ArrowLeft: <path d="M19 12H5M12 19l-7-7 7-7" />,
            Lock: <path d="M12 10v4M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Z"/>,
            ShieldCheck: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />,
            Cookie: <path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5" />,
            UserCheck: <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />,
            Database: <g><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" /><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" /></g>
        };

        const PrivacyPolicy = () => {
            return (
                <div className="min-h-screen pb-20">
                    
                    {/* --- NAV: RETOUR --- */}

                        <a href="index.html" className="sticker bg-white px-4 py-2 inline-flex items-center gap-2 pointer-events-auto hover:bg-black hover:text-white transition-colors group">

                    </nav>

                    {/* --- HEADER --- */}
                    <header className="pt-32 pb-16 px-4 text-center">
                        <div className="inline-block relative">
                            <h1 className="text-4xl md:text-7xl font-bold tracking-tighter mb-4 text-black uppercase">

                            <div className="absolute top-0 right-0 stamp-top-secret opacity-70 hidden md:block">

                    </header>

                    {/* --- MAIN CONTENT (DOSSIER STYLE) --- */}
                    <div className="max-w-4xl mx-auto px-4">
                        
                        {/* Tab Headers */}
                        <div className="flex pl-4 space-x-2">
                            <div className="bg-white border-t-2 border-x-2 border-black px-6 py-2 folder-tab font-mono text-xs font-bold relative top-[2px] z-10">
                                FICHIER #RGPD-2026
                            </div>
                        </div>

                        {/* Folder Body */}
                        <div className="bg-white border-2 border-black p-8 md:p-12 shadow-[12px_12px_0px_#3b3b3b] relative">
                            
                            {/* Intro Text */}
                            <div className="typewriter text-sm md:text-base leading-relaxed mb-12 border-b border-dashed border-gray-300 pb-8">
                                <p className="mb-4">

                                    <strong>OBJET :</strong> Protection de votre vie privée.<br/>
                                    <strong>STATUT :</strong> <span className="bg-green-200 px-1">Actif</span>
                                </p>
                                <p>

                                    Nous les collectons uniquement pour vous permettre de travailler, d'être payé et protégé. Point barre.
                                </p>
                            </div>

                            <div className="space-y-12">

                                {/* Article 1: Responsable */}
                                <article className="relative pl-8 border-l-4 border-black">
                                    <div className="absolute -left-[26px] top-0 bg-black text-white rounded-full w-12 h-12 flex items-center justify-center">
                                        <ScribbleIcon path={Icons.ShieldCheck} className="w-6 h-6" />
                                    </div>
                                    <h2 className="text-2xl font-bold mb-4 font-sans uppercase">1. Le Responsable (C'est nous)</h2>
                                    <div className="font-mono text-sm bg-gray-50 p-4 border border-gray-200">
                                        <p><strong>Identité :</strong> E-KIGAI (SAS)</p>

                                    </div>
                                </article>

                                {/* Article 2: Les Données */}
                                <article className="relative pl-8 border-l-4 border-gray-200 hover:border-green-400 transition-colors">
                                    <div className="absolute -left-[14px] top-1 bg-white border-2 border-black w-6 h-6 rounded-full"></div>
                                    <h2 className="text-2xl font-bold mb-4 font-sans uppercase">2. Ce qu'on collecte</h2>
                                    <p className="font-mono text-sm mb-4">Nous collectons le strict nécessaire pour gérer votre activité d'entrepreneur-salarié :</p>
                                    <ul className="grid md:grid-cols-2 gap-4 font-mono text-xs">
                                        <li className="bg-yellow-50 p-3 border border-black transform rotate-1">
                                            <strong>Identité :</strong> Nom, Prénom, Adresse, <span className="redacted" title="Sécurité Sociale">NIR</span>
                                        </li>
                                        <li className="bg-yellow-50 p-3 border border-black transform -rotate-1">
                                            <strong>Pro :</strong> CV, Factures, Contrats clients
                                        </li>
                                        <li className="bg-yellow-50 p-3 border border-black transform rotate-1">
                                            <strong>Finances :</strong> RIB, Bulletins de paie
                                        </li>
                                        <li className="bg-yellow-50 p-3 border border-black transform -rotate-1">
                                            <strong>Connexion :</strong> Logs, Cookies (pour que le site marche)

                                    </ul>
                                </article>

                                {/* Article 3: Utilisation */}
                                <article className="relative pl-8 border-l-4 border-gray-200 hover:border-green-400 transition-colors">
                                    <div className="absolute -left-[14px] top-1 bg-white border-2 border-black w-6 h-6 rounded-full"></div>
                                    <h2 className="text-2xl font-bold mb-4 font-sans uppercase">3. Pourquoi on le fait ?</h2>

                                        <p>⚖️ <strong>Obligations Légales :</strong> Déclarations URSSAF, impôts, médecine du travail.</p>
                                        <p>🎁 <strong>Avantages :</strong> Vous inscrire sur <em>May</em> et <em>Klaro</em> (avec votre accord).</p>
                                        <p>🚫 <strong>Jamais :</strong> Nous ne revendons vos données à des tiers publicitaires.</p>
                                    </div>
                                </article>

                                {/* Article 4: Partage */}
                                <article className="relative pl-8 border-l-4 border-gray-200 hover:border-green-400 transition-colors">
                                    <div className="absolute -left-[14px] top-1 bg-white border-2 border-black w-6 h-6 rounded-full"></div>
                                    <h2 className="text-2xl font-bold mb-4 font-sans uppercase">4. Qui y a accès ?</h2>
                                    <p className="font-mono text-sm mb-4">Uniquement les personnes habilitées :</p>
                                    <div className="flex flex-wrap gap-2">
                                        <span className="bg-gray-200 px-2 py-1 rounded text-xs font-mono">L'équipe RH e-kigai</span>
                                        <span className="bg-gray-200 px-2 py-1 rounded text-xs font-mono">L'expert-comptable</span>
                                        <span className="bg-gray-200 px-2 py-1 rounded text-xs font-mono">L'URSSAF / Impôts</span>
                                        <span className="bg-gray-200 px-2 py-1 rounded text-xs font-mono">Hébergeur Sécurisé</span>
                                    </div>
                                </article>

                                {/* Article 5: Sécurité */}
                                <article className="relative pl-8 border-l-4 border-black bg-black text-white p-6 -mr-6 md:-mr-12 my-8 shadow-lg transform rotate-1">
                                    <div className="absolute -left-[26px] top-6 bg-green-500 text-black rounded-full w-12 h-12 flex items-center justify-center border-2 border-white">
                                        <ScribbleIcon path={Icons.Lock} className="w-6 h-6" />
                                    </div>
                                    <h2 className="text-2xl font-bold mb-2 font-sans uppercase text-green-400">5. Zone Sécurisée</h2>
                                    <p className="font-mono text-sm opacity-90">
                                        Toutes les données sont stockées sur des serveurs sécurisés en Europe (RGPD compliant).
                                        Accès restreints par authentification forte. Chiffrement SSL/TLS pour les transferts.
                                    </p>
                                </article>

                                {/* Article 6: Vos Droits */}
                                <article className="relative pl-8 border-l-4 border-gray-200 hover:border-green-400 transition-colors">
                                    <div className="absolute -left-[14px] top-1 bg-white border-2 border-black w-6 h-6 rounded-full"></div>
                                    <h2 className="text-2xl font-bold mb-4 font-sans uppercase">6. Vos Super-Pouvoirs</h2>
                                    <p className="font-mono text-sm mb-4">Conformément à la loi, vous avez le droit de :</p>
                                    <ul className="space-y-2 font-mono text-sm">
                                        <li className="flex items-center gap-2"><ScribbleIcon path={Icons.UserCheck} className="w-4 h-4"/> Demander à voir vos données (Accès)</li>
                                        <li className="flex items-center gap-2"><ScribbleIcon path={Icons.UserCheck} className="w-4 h-4"/> Corriger une erreur (Rectification)</li>
                                        <li className="flex items-center gap-2"><ScribbleIcon path={Icons.UserCheck} className="w-4 h-4"/> Tout supprimer (Oubli - sauf obligations légales)</li>
                                        <li className="flex items-center gap-2"><ScribbleIcon path={Icons.UserCheck} className="w-4 h-4"/> Récupérer vos données (Portabilité)</li>
                                    </ul>
                                    <div className="mt-6">
                                        <a href="mailto:contact@e-kigai.fr" className="sticker bg-black text-white px-4 py-2 text-sm font-bold inline-block hover:bg-green-600 transition-colors border-transparent">
                                            Exercer mes droits ->
                                        </a>
                                    </div>
                                </article>

                                {/* Article 7: Cookies */}
                                <article className="relative pl-8 border-l-4 border-gray-200 hover:border-green-400 transition-colors">
                                    <div className="absolute -left-[14px] top-1 bg-white border-2 border-black w-6 h-6 rounded-full"></div>
                                    <h2 className="text-2xl font-bold mb-4 font-sans uppercase flex items-center gap-2">
                                        7. Cookies <ScribbleIcon path={Icons.Cookie} className="w-6 h-6" />
                                    </h2>
                                    <p className="font-mono text-sm">
                                        On aime les cookies au chocolat, moins les traceurs.
                                        Ce site utilise uniquement des cookies techniques essentiels et des cookies de mesure d'audience anonymes (respectueux de la vie privée).
                                        Pas de pub ciblée ici.
                                    </p>
                                </article>

                            </div>

                            {/* Signature */}
                            <div className="mt-16 flex justify-end">
                                <div className="text-center">
                                    <div className="font-mono text-xs mb-2">Validé par la Direction</div>
                                    <div className="hand-font text-3xl text-blue-700 rotate-[-5deg]">e-kigai Corp.</div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <footer className="text-center mt-20 font-mono text-xs opacity-50">
                        © 2026 e-kigai. En cas de litige, vous pouvez contacter la <a href="https://www.cnil.fr" className="underline hover:text-black">CNIL</a>.
                    </footer>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PrivacyPolicy />);
    </script>
</body>
</html>
