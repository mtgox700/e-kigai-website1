<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formateurs & Intervenants | e-kigai</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Space+Grotesk:wght@300;500;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #ffffef;
            --dark: #3b3b3b;
            --green: #00bf63;
            --chalkboard: #2d3748;
            --paper-grain: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }

        body {
            background-color: var(--cream);
            color: var(--dark);
            font-family: 'Space Grotesk', sans-serif;
            background-image: var(--paper-grain);
            overflow-x: hidden;
            cursor: crosshair;
        }

        .hand-font { font-family: 'Gochi Hand', cursive; }
        .mono-font { font-family: 'Courier Prime', monospace; }

        /* Sticker Style */
        .sticker {
            background: white;
            border: 2px solid var(--dark);
            box-shadow: 4px 4px 0px var(--dark);
            transition: all 0.2s ease;
        }
        .sticker:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--green);
        }

        /* Chalk Effect */
        .chalk-border {
            border: 3px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        /* Badge NDA */
        .badge-nda {
            background: #fef3c7;
            color: #92400e;
            border: 2px dashed #92400e;
            padding: 5px 10px;
            font-family: 'Courier Prime', monospace;
            font-weight: bold;
            transform: rotate(-3deg);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // SVG Icons
        const ScribbleIcon = ({ path, className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className} style={{overflow: 'visible'}}>
                {path}
            </svg>
        );

        const Icons = {
            ArrowLeft: <path d="M19 12H5M12 19l-7-7 7-7" />,
            Check: <path d="M20 6 9 17l-5-5" />,
            BookOpen: <g><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></g>,
            GraduationCap: <path d="M22 10v6M2 10l10-5 10 5-10 5zM6 12v5c3 3 9 3 12 0v-5" />,
            FileCheck: <g><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" /><polyline points="14 2 14 8 20 8" /><path d="m9 15 2 2 4-4" /></g>,
            Stamp: <g><path d="M5 22h14" /><path d="M19.27 13.73A2.665 2.665 0 0 1 17.5 18l-8 1-5.5-2.5a4.666 4.666 0 0 1 1.29-8.49L7 8" /><path d="M15 11l5 5" /></g>
        };

        const FormationPage = () => {
            return (
                <div className="min-h-screen pb-20 relative">
                    
                    {/* --- DECORATION --- */}
                    <div className="fixed inset-0 pointer-events-none z-0 opacity-5" style={{backgroundImage: 'radial-gradient(#3b3b3b 1px, transparent 1px)', backgroundSize: '30px 30px'}}></div>

                    {/* --- NAV: RETOUR --- */}
                    <nav className="fixed w-full z-50 top-6 left-6 pointer-events-none">
                        <a href="index.html" className="sticker bg-white px-4 py-2 inline-flex items-center gap-2 pointer-events-auto hover:bg-black hover:text-white transition-colors group">
                            <ScribbleIcon path={Icons.ArrowLeft} className="w-5 h-5 group-hover:-translate-x-1 transition-transform" />
                            <span className="font-bold font-mono">Retour Site</span>
                        </a>
                    </nav>

                    {/* --- HERO SECTION --- */}
                    <header className="pt-32 pb-16 px-4 text-center relative z-10">
                        <div className="inline-block relative">
                            <div className="absolute -top-8 -right-8 sticker bg-yellow-300 px-4 py-2 rotate-[6deg] shadow-lg hidden md:block">
                                <span className="font-bold font-mono">NDA INCLUS !</span>
                            </div>
                            <h1 className="text-5xl md:text-8xl font-bold tracking-tighter mb-4 text-black uppercase leading-[0.9]">
                                DEVIENS FORMATEUR <br/>
                                <span className="text-green-600">SANS LIMITES</span>
                            </h1>
                        </div>
                        <p className="hand-font text-2xl mt-6 text-gray-600 rotate-[-1deg] max-w-2xl mx-auto">
                            Formateurs(trice), vacataires, intervenant(e)s : oubliez la paperasse de la DRIEETS.
                            <br/>On a déjà le numéro pour vous.
                        </p>
                    </header>

                    {/* --- THE PAIN POINT (BLACKBOARD) --- */}
                    <section className="max-w-5xl mx-auto px-4 mb-24 relative z-10">
                        <div className="bg-[#2d3748] text-white p-8 md:p-12 rotate-1 shadow-[10px_10px_0px_#00bf63] chalk-border relative">
                            {/* Chalk dust effect */}
                            <div className="absolute inset-0 bg-white opacity-5 mix-blend-overlay pointer-events-none filter blur-sm"></div>
                            
                            <h2 className="text-3xl font-bold mb-8 hand-font text-center underline decoration-wavy decoration-white/30">Pourquoi c'est l'enfer en solo ?</h2>
                            
                            <div className="grid md:grid-cols-2 gap-8 font-mono text-sm">
                                <div>
                                    <h3 className="text-red-300 font-bold mb-2 uppercase border-b border-white/20 pb-1">Le Parcours du Combattant</h3>
                                    <ul className="space-y-4">
                                        <li className="flex gap-3 items-start opacity-80">
                                            <span>❌</span> Obtenir un numéro de déclaration d'activité (NDA) à la DREETS.
                                        </li>
                                        <li className="flex gap-3 items-start opacity-80">
                                            <span>❌</span> Remplir le Bilan Pédagogique et Financier (BPF) chaque année.
                                        </li>
                                        <li className="flex gap-3 items-start opacity-80">
                                            <span>❌</span> Être certifié Qualiopi pour que vos clients soient financés (OPCO).
                                        </li>
                                    </ul>
                                </div>
                                <div className="border-l-2 border-white/10 pl-8 relative">
                                    <div className="absolute top-1/2 -left-3 bg-[#2d3748] p-1 text-2xl">👉</div>
                                    <h3 className="text-green-300 font-bold mb-2 uppercase border-b border-white/20 pb-1">La Solution e-kigai</h3>
                                    <p className="mb-4">
                                        E-kigai est un organisme de formation déclaré. 
                                    </p>
                                    <ul className="space-y-2">
                                        <li className="flex gap-2 items-center text-lg font-bold text-yellow-200">
                                            <ScribbleIcon path={Icons.Check} className="w-5 h-5"/> Vous utilisez notre NDA
                                        </li>
                                        <li className="flex gap-2 items-center text-lg font-bold text-yellow-200">
                                            <ScribbleIcon path={Icons.Check} className="w-5 h-5"/> On gère le BPF
                                        </li>
                                        <li className="flex gap-2 items-center text-lg font-bold text-yellow-200">
                                            <ScribbleIcon path={Icons.Check} className="w-5 h-5"/> Conventions prêtes
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* --- FEATURES (CARDS) --- */}
                    <section className="max-w-6xl mx-auto px-4 mb-24 relative z-10">
                        <div className="grid md:grid-cols-3 gap-8">
                            
                            {/* Card 1 */}
                            <div className="bg-white p-6 border-2 border-black hover:-translate-y-2 transition-transform shadow-lg group relative">
                                <div className="absolute -top-3 -left-3 bg-blue-100 p-2 border border-black rounded-full">
                                    <ScribbleIcon path={Icons.GraduationCap} className="w-8 h-8 text-blue-600"/>
                                </div>
                                <h3 className="text-xl font-bold mt-4 mb-2">Intervenants Écoles</h3>
                                <p className="font-mono text-sm opacity-80 mb-4">
                                    Plus besoin de courir après le statut d'auto-entrepreneur pour quelques heures de cours par an.
                                    Facturez l'école via e-kigai et recevez un salaire.
                                </p>
                                <div className="badge-nda text-xs inline-block">Idéal Vacataires</div>
                            </div>

                            {/* Card 2 */}
                            <div className="bg-white p-6 border-2 border-black hover:-translate-y-2 transition-transform shadow-lg group relative mt-8 md:mt-0">
                                <div className="absolute -top-3 -right-3 bg-green-100 p-2 border border-black rounded-full">
                                    <ScribbleIcon path={Icons.FileCheck} className="w-8 h-8 text-green-600"/>
                                </div>
                                <h3 className="text-xl font-bold mt-4 mb-2">Administratif Zéro</h3>
                                <p className="font-mono text-sm opacity-80 mb-4">
                                    Conventions de formation, feuilles d'émargement, attestations de fin de formation...
                                    On vous fournit les modèles conformes ou on gère pour vous.
                                </p>
                            </div>

                            {/* Card 3 */}
                            <div className="bg-white p-6 border-2 border-black hover:-translate-y-2 transition-transform shadow-lg group relative">
                                <div className="absolute -top-3 -left-3 bg-yellow-100 p-2 border border-black rounded-full">
                                    <ScribbleIcon path={Icons.Stamp} className="w-8 h-8 text-yellow-600"/>
                                </div>
                                <h3 className="text-xl font-bold mt-4 mb-2">Exonération de Taxe</h3>
                                <p className="font-mono text-sm opacity-80 mb-4">
                                    En tant qu'organisme de formation, nos prestations de formation professionnelle peuvent être exonérées de TVA (selon éligibilité).
                                </p>
                                <div className="text-xs bg-gray-100 p-1 font-mono">Art. 261-4-4° CGI</div>
                            </div>

                        </div>
                    </section>

                    {/* --- CTA FINAL --- */}
                    <section className="py-20 px-4 bg-[#f0f9ff] border-y-4 border-black relative text-center">
                         <div className="max-w-3xl mx-auto">
                            <h2 className="text-4xl font-bold mb-6">Prêt à transmettre votre savoir ?</h2>
                            <p className="font-mono text-lg mb-8">
                                Rejoignez le pôle formation d'e-kigai. Vous enseignez, on s'occupe du reste (DREETS, Facturation, Paie).
                            </p>
                            <a href="https://mte.typeform.com/e-kigai" className="sticker bg-black text-white px-8 py-4 font-bold text-xl inline-block hover:bg-green-600 border-2 border-black transition-colors btn-wobble">
                                JE VEUX ME LANCER !
                            </a>
                            <p className="mt-6 font-mono">
                                <a href="formateurs-nda.html" className="underline decoration-2 underline-offset-4 hover:text-green-700">Devenir formateur : découvrir les étapes et comprendre le NDA →</a>
                            </p>
                            <p className="mt-4 text-xs opacity-50 font-mono">
                                Lien officiel : <a href="https://entreprendre.service-public.gouv.fr/vosdroits/F19087" target="_blank" className="underline hover:text-black">Déclaration d'activité (Service Public)</a>
                            </p>
                         </div>
                    </section>

                    <footer className="text-center mt-10 font-mono text-xs opacity-50 pb-10">
                        © 2026 e-kigai. Organisme de formation déclaré. <a href="index.html" className="underline">Retour au site principal</a>
                    </footer>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FormationPage />);
    </script>
</body>
</html>
