    <style>

        body {
            background-color: var(--cream);
            color: var(--dark);
            font-family: 'Space Grotesk', sans-serif;
            background-image: var(--paper-grain);
            overflow-x: hidden;
            cursor: crosshair;
        }

        .hand-font { font-family: 'Gochi Hand', cursive; }
        .mono-font { font-family: 'Courier Prime', monospace; }

        /* Blueprint Grid Background */
        .blueprint-grid {
            background-image: linear-gradient(var(--blue-epmi) 1px, transparent 1px),
            linear-gradient(90deg, var(--blue-epmi) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: center center;
            opacity: 0.1;
        }

        /* Sticker Style */
        .sticker {
            background: white;
            border: 2px solid var(--dark);
            box-shadow: 4px 4px 0px var(--dark);
            transition: all 0.2s ease;
        }
        .sticker:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--green);
        }

        /* Polaroids */
        .polaroid {
            background: white;
            padding: 10px 10px 40px 10px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
            transform: rotate(-2deg);
            transition: transform 0.3s;
        }
        .polaroid:hover {
