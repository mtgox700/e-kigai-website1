    <style>
        :root {

        }

        body {
            background-color: var(--cream);
            color: var(--dark);
            font-family: 'Space Grotesk', sans-serif;
            background-image: var(--paper-grain);
            overflow-x: hidden;
            cursor: crosshair; /* Curseur artistique */
        }

        h1, h2, h3, .brutal-font {
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: -0.04em;
        }

        .hand-font {
            font-family: 'Gochi Hand', cursive;
        }

        /* Effet "Papier Déchiré" via CSS Clip-path */
        .torn-paper-top {
            clip-path: polygon(0% 10px, 5% 0px, 10% 12px, 15% 2px, 20% 10px, 25% 0px, 30% 12px, 35% 2px, 40% 10px, 45% 0px, 50% 12px, 55% 2px, 60% 10px, 65% 0px, 70% 12px, 75% 2px, 80% 10px, 85% 0px, 90% 12px, 95% 2px, 100% 10px, 100% 100%, 0% 100%);
        }

        .torn-paper-bottom {
            clip-path: polygon(0% 0%, 100% 0%, 100% calc(100% - 10px), 95% 100%, 90% calc(100% - 12px), 85% 100%, 80% calc(100% - 10px), 75% 100%, 70% calc(100% - 12px), 65% 100%, 60% calc(100% - 10px), 55% 100%, 50% calc(100% - 12px), 45% 100%, 40% calc(100% - 10px), 35% 100%, 30% calc(100% - 12px), 25% 100%, 20% calc(100% - 10px), 15% 100%, 10% calc(100% - 12px), 5% 100%, 0% calc(100% - 10px));
        }

        /* Style Neo-Brutalist Sticker */
        .sticker {
            background: white;
            border: 2px solid var(--dark);
            box-shadow: 4px 4px 0px var(--dark);
            transition: all 0.2s ease;
        }
        .sticker:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--green);
        }

        /* Blob organique (forme aléatoire) */
        .organic-blob {
            border-radius: 64% 36% 29% 71% / 58% 38% 62% 42%;
            animation: morph 8s ease-in-out infinite;
        }
        @keyframes morph {
            0% { border-radius: 64% 36% 29% 71% / 58% 38% 62% 42%; }
            50% { border-radius: 36% 64% 71% 29% / 42% 62% 38% 58%; }
            100% { border-radius: 64% 36% 29% 71% / 58% 38% 62% 42%; }
        }

        /* Effet de texte surligné */
        .marker-highlight {
            background: linear-gradient(120deg, rgba(0,191,99,0) 0%, rgba(0,191,99,0.4) 100%);
            background-repeat: no-repeat;
            background-size: 100% 40%;
            background-position: 0 88%;
        }

        /* Animation de flottement */
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Bouton "Wobble" */
        .btn-wobble:hover {
            animation: wobble 0.5s ease-in-out;
        }
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            75% { transform: rotate(3deg); }
        }

</head>
