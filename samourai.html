        /* Brush Stroke Effect */
        .brush-stroke {
            position: relative;
            z-index: 1;
        }
        .brush-stroke::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-1deg);
            width: 105%;
            height: 110%;
            background-color: var(--samurai-red);
            z-index: -1;
            clip-path: polygon(2% 10%, 95% 5%, 98% 45%, 92% 90%, 5% 95%, 0% 50%);
            opacity: 0.9;
        }

        /* Glitch Effect */
        .glitch-red {
            text-shadow: 2px 0 var(--samurai-red), -2px 0 blue;
            animation: noise 3s infinite linear alternate-reverse;
        }
        @keyframes noise {
            0% { clip-path: inset(40% 0 61% 0); }
            20% { clip-path: inset(92% 0 1% 0); }
            40% { clip-path: inset(43% 0 1% 0); }
            60% { clip-path: inset(25% 0 58% 0); }
            80% { clip-path: inset(54% 0 7% 0); }
            100% { clip-path: inset(58% 0 43% 0); }
        }

        /* Card Style */
