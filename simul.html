<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur de Revenus | e-kigai</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Space+Grotesk:wght@300;500;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #ffffef;
            --dark: #3b3b3b;
            --green: #00bf63;
            --paper-grain: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }

        body {
            background-color: var(--cream);
            color: var(--dark);
            font-family: 'Space Grotesk', sans-serif;
            background-image: var(--paper-grain);
            overflow-x: hidden;
            cursor: crosshair;
        }

        .hand-font { font-family: 'Gochi Hand', cursive; }
        .mono-font { font-family: 'Courier Prime', monospace; }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #00bf63;
            border: 2px solid black;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 2px 2px 0px black;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: black;
            border-radius: 2px;
        }

        /* Sticker Style */
        .sticker {
            background: white;
            border: 2px solid var(--dark);
            box-shadow: 4px 4px 0px var(--dark);
            transition: all 0.2s ease;
        }
        .sticker:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--green);
        }

        /* Paper Receipt Animation */
        .receipt {
            background-image: repeating-linear-gradient(#fff 0 1px, transparent 1px 100%),
                              repeating-linear-gradient(90deg, #fff 0 1px, transparent 1px 100%);
            background-size: 20px 20px;
            filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.1));
        }
        .receipt::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(45deg, transparent 33.333%, #fff 33.333%, #fff 66.667%, transparent 66.667%),
                        linear-gradient(-45deg, transparent 33.333%, #fff 33.333%, #fff 66.667%, transparent 66.667%);
            background-size: 20px 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONES ---
        const ScribbleIcon = ({ path, className }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className} style={{overflow: 'visible'}}>
                {path}
            </svg>
        );

        const Icons = {
            ArrowLeft: <path d="M19 12H5M12 19l-7-7 7-7" />,
            Calculator: <g><rect width="16" height="20" x="4" y="2" rx="2" /><line x1="8" x2="16" y1="6" y2="6" /><line x1="16" x2="16" y1="14" y2="18" /><path d="M16 10h.01" /><path d="M12 10h.01" /><path d="M8 10h.01" /><path d="M12 14h.01" /><path d="M8 14h.01" /><path d="M12 18h.01" /><path d="M8 18h.01" /></g>,
            Wallet: <g><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" /><path d="M3 5v14a2 2 0 0 0 2 2h16v-5" /><path d="M18 12a2 2 0 0 0 0 4h4v-4Z" /></g>,
            Piggy: <g><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1.4-1.1-2-3-2z" /><path d="M15.5 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" /><path d="M6 15v2" /><path d="M10 15v2" /></g>,
            Refresh: <g><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></g>,
            Sparkles: <g><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /><path d="M5 3v4" /><path d="M9 5H5" /></g>
        };

        const SimulationPage = () => {
            // State
            const [turnover, setTurnover] = useState(5000); // CA Mensuel HT
            const [expenses, setExpenses] = useState(750);  // Frais Pro HT (Initialisé à 15% de 5000)
            const [isAnnual, setIsAnnual] = useState(false);

            // Calculs
            const contributionRate = 0.025; // 2.5%
            const optimizationRate = 0.30; // 30% (Optimisation e-kigai)
            
            const contribution = turnover * contributionRate;
            const optimization = turnover * optimizationRate;
            
            // Assiette pour le salaire = CA - Coop - Frais - Optimisation (mis de côté pour être redonné)
            const availableForSalary = turnover - contribution - expenses - optimization;
            
            const netSalaryRatio = 0.61; // Ratio prudent Net/SuperBrut
            const netSalary = Math.max(0, availableForSalary * netSalaryRatio);
            
            // Total Poche = Net + Frais + Optimisation
            const totalPocket = netSalary + expenses + optimization; 

            // Formatters
            const formatCurrency = (val) => {
                return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(val);
            };

            // Update expenses when turnover changes significantly if user hasn't locked it (simplified: just update logic example)
            // Pour l'UX, on ne force pas le slider si l'utilisateur le bouge, mais on pourrait.
            // Ici on laisse l'utilisateur libre mais on indique les taux.

            return (
                <div className="min-h-screen pb-20 relative">
                    
                    {/* --- DECORATION --- */}
                    <div className="fixed top-0 right-0 w-64 h-64 bg-yellow-200 rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none"></div>
                    <div className="fixed bottom-0 left-0 w-96 h-96 bg-green-200 rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none"></div>

                    {/* --- NAV: RETOUR --- */}
                    <nav className="fixed w-full z-50 top-6 left-6 pointer-events-none">
                        <a href="index.html" className="sticker bg-white px-4 py-2 inline-flex items-center gap-2 pointer-events-auto hover:bg-black hover:text-white transition-colors group">
                            <ScribbleIcon path={Icons.ArrowLeft} className="w-5 h-5 group-hover:-translate-x-1 transition-transform" />
                            <span className="font-bold font-mono">Retour</span>
                        </a>
                    </nav>

                    {/* --- HEADER --- */}
                    <header className="pt-32 pb-12 px-4 text-center">
                        <div className="inline-block relative">
                            <h1 className="text-5xl md:text-7xl font-bold tracking-tighter mb-2">
                                LA MACHINE À <br/>
                                <span className="text-green-600">CALCULER</span>
                            </h1>
                            <div className="absolute -right-12 -top-8 rotate-12 sticker bg-yellow-300 px-3 py-1 font-bold hand-font text-xl border-black hidden md:block">
                                Combien tu gagnes ?
                            </div>
                        </div>
                        <p className="font-mono text-lg mt-6 max-w-xl mx-auto opacity-70">
                            Règle les curseurs pour voir combien tu peux te verser en salaire net + frais remboursés + optimisations.
                        </p>
                    </header>

                    {/* --- CALCULATOR INTERFACE --- */}
                    <section className="max-w-6xl mx-auto px-4 grid lg:grid-cols-12 gap-12 items-start">
                        
                        {/* CONTROLS (LEFT) */}
                        <div className="lg:col-span-7 space-y-8">
                            <div className="bg-white border-4 border-black p-8 shadow-[10px_10px_0px_rgba(0,0,0,1)] relative">
                                {/* Toggle Mensuel / Annuel */}
                                <div className="absolute -top-5 right-8 bg-black text-white px-4 py-2 font-mono text-sm font-bold flex gap-4 rounded-full cursor-pointer border-2 border-white">
                                    <span onClick={() => setIsAnnual(false)} className={!isAnnual ? "text-green-400 underline" : "opacity-50"}>Mensuel</span>
                                    <span>/</span>
                                    <span onClick={() => setIsAnnual(true)} className={isAnnual ? "text-green-400 underline" : "opacity-50"}>Annuel</span>
                                </div>

                                {/* Slider 1: CA */}
                                <div className="mb-10">
                                    <label className="flex justify-between items-end mb-4">
                                        <span className="text-2xl font-bold font-sans">Chiffre d'Affaires (HT)</span>
                                        <div className="bg-gray-100 px-4 py-2 border-2 border-black font-mono text-2xl font-bold min-w-[150px] text-right">
                                            {turnover} €
                                        </div>
                                    </label>
                                    <input 
                                        type="range" 
                                        min="0" 
                                        max={isAnnual ? 150000 : 15000} 
                                        step={isAnnual ? 1000 : 100} 
                                        value={turnover}
                                        onChange={(e) => {
                                            const newVal = Number(e.target.value);
                                            setTurnover(newVal);
                                            // Optional: Auto adjust expenses to ~15% if desired, but user input is better. 
                                            // Here we just let user control expenses.
                                        }}
                                        className="w-full"
                                    />
                                    <div className="flex justify-between text-xs font-mono opacity-50 mt-2">
                                        <span>0 €</span>
                                        <span>{isAnnual ? '150 k€' : '15 k€'}</span>
                                    </div>
                                </div>

                                {/* Slider 2: Frais */}
                                <div>
                                    <label className="flex justify-between items-end mb-4">
                                        <span className="text-2xl font-bold font-sans flex items-center gap-2">
                                            Frais Pros
                                            <span className="text-xs bg-yellow-200 px-2 py-1 rounded border border-black font-mono font-normal transform -rotate-2">15% Moyenne</span>
                                        </span>
                                        <div className="bg-gray-100 px-4 py-2 border-2 border-black font-mono text-2xl font-bold min-w-[150px] text-right">
                                            {expenses} €
                                        </div>
                                    </label>
                                    <input 
                                        type="range" 
                                        min="0" 
                                        max={turnover * 0.5} 
                                        step={50} 
                                        value={expenses}
                                        onChange={(e) => setExpenses(Number(e.target.value))}
                                        className="w-full"
                                    />
                                    <p className="text-xs font-mono opacity-60 mt-3">
                                        *Inclut : matériel, logiciels, déplacements, repas clients, loyer quote-part...
                                    </p>
                                </div>
                            </div>

                            {/* Details (Notepad) */}
                            <div className="bg-yellow-100 p-6 border-2 border-black rotate-[-1deg] relative shadow-md">
                                <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-32 h-8 bg-white/50 rotate-2 border-l border-r border-dashed border-gray-400"></div>
                                <h3 className="hand-font text-2xl font-bold mb-4">Détail du calcul 🤓</h3>
                                <ul className="space-y-3 font-mono text-sm">
                                    <li className="flex justify-between border-b border-black/10 pb-1">
                                        <span>CA Encaissé</span>
                                        <span className="font-bold">{formatCurrency(turnover)}</span>
                                    </li>
                                    <li className="flex justify-between border-b border-black/10 pb-1 text-red-600">
                                        <span>- Contribution Coop (2,5%)</span>
                                        <span>- {formatCurrency(contribution)}</span>
                                    </li>
                                    <li className="flex justify-between border-b border-black/10 pb-1 text-blue-600">
                                        <span>- Frais Pros (Remboursés)</span>
                                        <span>- {formatCurrency(expenses)}</span>
                                    </li>
                                    <li className="flex justify-between border-b border-black/10 pb-1 text-purple-600 font-bold">
                                        <span>- Optimisation e-kigai</span>
                                        <span>- {formatCurrency(optimization)}</span>
                                    </li>
                                    <li className="flex justify-between pt-2">
                                        <span className="font-bold">= Assiette Salaire (Super Brut)</span>
                                        <span className="font-bold text-lg">{formatCurrency(availableForSalary)}</span>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        {/* RESULTS (RIGHT) - THE RECEIPT */}
                        <div className="lg:col-span-5 flex justify-center">
                            <div className="bg-white receipt p-8 w-full max-w-md border-x border-t border-gray-200 relative transform rotate-1">
                                <div className="text-center border-b-2 border-black pb-6 mb-6">
                                    <div className="font-bold text-2xl tracking-widest uppercase">MA RÉMUNÉRATION</div>
                                    <div className="font-mono text-xs opacity-50 mt-1">{new Date().toLocaleDateString()} - e-kigai Corp</div>
                                </div>

                                <div className="space-y-6">
                                    <div className="flex justify-between items-center">
                                        <div className="flex items-center gap-3">
                                            <div className="bg-black text-white p-2 rounded">
                                                <ScribbleIcon path={Icons.Wallet} className="w-6 h-6" />
                                            </div>
                                            <span className="font-bold text-lg">Salaire Net</span>
                                        </div>
                                        <span className="font-mono text-2xl font-bold">{formatCurrency(netSalary)}</span>
                                    </div>

                                    <div className="flex justify-between items-center">
                                        <div className="flex items-center gap-3">
                                            <div className="bg-green-500 text-white p-2 rounded">
                                                <ScribbleIcon path={Icons.Refresh} className="w-6 h-6" />
                                            </div>
                                            <span className="font-bold text-lg">Frais Remboursés</span>
                                        </div>
                                        <span className="font-mono text-2xl font-bold text-green-600">+{formatCurrency(expenses)}</span>
                                    </div>

                                    <div className="flex justify-between items-center">
                                        <div className="flex items-center gap-3">
                                            <div className="bg-purple-500 text-white p-2 rounded">
                                                <ScribbleIcon path={Icons.Sparkles} className="w-6 h-6" />
                                            </div>
                                            <span className="font-bold text-lg">Optimisation e-kigai</span>
                                        </div>
                                        <span className="font-mono text-2xl font-bold text-purple-600">+{formatCurrency(optimization)}</span>
                                    </div>

                                    <div className="border-t-4 border-black my-6"></div>

                                    <div className="bg-gray-900 text-white p-6 -mx-4 transform scale-105 shadow-xl relative">
                                        <div className="text-center">
                                            <div className="text-sm font-mono opacity-70 uppercase mb-1">Total dans ta poche</div>
                                            <div className="text-5xl font-bold tracking-tight text-green-400">{formatCurrency(totalPocket)}</div>
                                            <div className="text-xs font-mono mt-2 opacity-50">{isAnnual ? '/ an' : '/ mois'}</div>
                                        </div>
                                    </div>

                                    <div className="pt-4 text-center space-y-4">
                                        <p className="hand-font text-lg text-gray-500">
                                            + Éligibilité Chômage & Retraite ✅
                                        </p>
                                        <p className="hand-font text-lg text-gray-500">
                                            + Participation aux bénéfices 🎁
                                        </p>
                                    </div>
                                </div>

                                {/* Barcode decoration */}
                                <div className="mt-12 h-12 bg-[url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAMklEQVQ4T2nk5+fdzAAljHA0IzMzE6MhALokkIYRRoMBNIwwGgygYYTRYAANI4wGAwAAzZ0MC/r0v/kAAAAASUVORK5CYII=')] bg-repeat-x opacity-30"></div>
                            </div>
                        </div>

                    </section>

                    {/* --- CTA SECTION --- */}
                    <section className="py-24 text-center px-4">
                        <div className="inline-block border-2 border-black p-8 bg-green-400 rotate-2 hover:rotate-0 transition-transform cursor-pointer shadow-[8px_8px_0px_#000]">
                            <h2 className="text-4xl font-bold mb-4">Ces chiffres te plaisent ?</h2>
                            <p className="font-mono mb-6 max-w-md mx-auto">
                                Attention c'est une estimation. En vrai, il faut réaliser une simulation personnalisée pour avoir une idée claire et précise de la meilleure situation pour toi.
                            </p>
                            <a href="https://mte.typeform.com/e-kigai" className="bg-black text-white px-8 py-3 font-bold text-xl inline-block hover:bg-white hover:text-black border-2 border-black transition-colors">
                                PRENDRE RDV
                            </a>
                        </div>
                    </section>

                    <footer className="text-center mt-10 font-mono text-xs opacity-50">
                        © 2026 e-kigai. Simulateur non contractuel. <a href="index.html" className="underline">Retour au site</a>
                    </footer>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SimulationPage />);
    </script>
</body>
</html>
